services:
  kafka:
    image: apache/kafka:3.7.2
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://kafka:9093,PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - kafka-network

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /docker/create-topics.sh
    volumes:
      - ./docker/create-topics.sh:/docker/create-topics.sh:ro
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.1
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network

  mongo:
    image: mongo:7.0
    hostname: mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set si no existe y solo reporta healthy cuando
      # el nodo es PRIMARY. rs.status() lanza excepción si no hay config, así que
      # se captura y se corre rs.initiate() en ese caso.
      test: >
        mongosh --quiet --eval "try { if (rs.status().myState !== 1) { quit(1); } }
        catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); } catch (e2) {} quit(1); }"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - kafka-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kafka-network

  activation-api:
    build:
      context: .
      dockerfile: apps/activation-api/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: activation_db
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - kafka-network

  billing-service:
    build:
      context: .
      dockerfile: apps/billing-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: billing_db
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - kafka-network

  provisioning-service:
    build:
      context: .
      dockerfile: apps/provisioning-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: provisioning_db
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - kafka-network

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: notification_db
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: activaciones@poc.local
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    networks:
      - kafka-network

  crm-analytics-service:
    build:
      context: .
      dockerfile: apps/crm-analytics-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: crm_db
      PORT: "3004"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    networks:
      - kafka-network

  # Escenario 5: consumidor extra para loyalty; se levanta solo con el profile.
  # Consume desde el inicio del topic (auto.offset.reset=earliest) y solo loguea.
  loyalty-service:
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: apps/loyalty-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty-svc
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-network

  demo-ui:
    build:
      context: .
      dockerfile: apps/demo-ui/Dockerfile
      args:
        # El navegador corre en el host: el endpoint es localhost:3000
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      activation-api:
        condition: service_started
    networks:
      - kafka-network

volumes:
  kafka-data:
  mongo-data:

networks:
  kafka-network:
    driver: bridge